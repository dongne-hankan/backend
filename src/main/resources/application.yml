server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: dongne-hankan
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dongne_hankan}
    username: ${DB_USERNAME:dongne}
    password: ${DB_PASSWORD:dongne}
  jpa:
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 100
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: 30
    refresh-token-days: 14
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao}
