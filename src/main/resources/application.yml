spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: dongne-hankan
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dongne_hankan?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:dongne}
    password: ${DB_PASSWORD:dongne}
  jpa:
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 100
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # MAIL_HOST가 비어 있으면 메일을 보내지 않고 비밀번호 재설정 링크를 로그로 남긴다.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: 30
    refresh-token-days: 14
  mail:
    from: ${MAIL_FROM:no-reply@dongnehankan.local}
  password-reset:
    url: ${PASSWORD_RESET_URL:http://localhost:5173/password-reset}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao}
